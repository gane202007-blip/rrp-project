<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row">
        
        <!-- LOGIN -->
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3>Login</h3>

                <input id="email" class="form-control mt-2" placeholder="Email">
                <input id="password" type="password" class="form-control mt-2" placeholder="Password">

                <button onclick="login()" class="btn btn-success mt-3 w-100">Login</button>
            </div>
        </div>

        <!-- SIGNUP -->
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3>Signup</h3>

                <input id="name" class="form-control mt-2" placeholder="Name">
                <input id="email2" class="form-control mt-2" placeholder="Email">
                <input id="password2" type="password" class="form-control mt-2" placeholder="Password">

                <button onclick="signup()" class="btn btn-primary mt-3 w-100">Signup</button>
            </div>
        </div>

    </div>

</div>

<script>
async function login() {
    const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    const text = await res.text();

    try {
        const data = JSON.parse(text);
        alert(data.message);

        if (data.role === 'admin') {
            window.location = 'dashboard.html';
        } else {
            window.location = 'index.html';
        }
    } catch {
        alert(text);
    }
}

async function signup() {
    const res = await fetch('/signup', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            name: name.value,
            email: email2.value,
            password: password2.value
        })
    });

    const text = await res.text();
    alert(text);
}
</script>

</body>
</html>
