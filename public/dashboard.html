<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <span class="navbar-brand">Dashboard</span>

        <div>
            <span id="username" class="text-white me-3"></span>
            <a href="/logout" class="btn btn-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="row mb-3">

    <div class="col-md-4">
        <input type="date" id="startDate" class="form-control">
    </div>

    <div class="col-md-4">
        <input type="date" id="endDate" class="form-control">
    </div>

    <div class="col-md-4">
        <button onclick="loadDashboard()" class="btn btn-success w-100">
            Apply Filter
        </button>
    </div>

</div>
    <!-- Cards -->
    <div class="row">

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h5>Total Plastic</h5>
                <h3 id="total">0</h3>
                <p>kg</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h5>Bricks</h5>
                <h3 id="bricks">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h5>Road Length</h5>
                <h3 id="road">0</h3>
                <p>meters</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h5>CO₂ Saved</h5>
                <h3 id="co2">0</h3>
                <p>kg</p>
            </div>
        </div>

    </div>

    <!-- Chart -->
    <div class="card mt-4 shadow">
        <div class="card-header bg-success text-white">
            Plastic Type Distribution
        </div>
        <div class="card-body">
            <canvas id="chart"></canvas>
        </div>
    </div>

</div>

<div class="card mt-4 shadow">
    <div class="card-header bg-success text-white">
        Monthly Collection Trends
    </div>
    <div class="card-body">
        <canvas id="barChart"></canvas>
    </div>
</div>
<div class="card mt-4 shadow p-3">
    <h5>Insights</h5>
    <p>Top Plastic Type: <span id="topType"></span></p>
    <p>Average per Day: <span id="avgDay"></span> kg</p>
</div>
<script src="script.js">
    (async () => {
    const res = await fetch('/check-auth');
    const data = await res.json();

    if (!data.loggedIn) {
        window.location = 'login.html';
    }
})();
</script>
</body>
</html>
