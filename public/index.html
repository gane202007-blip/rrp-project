<!DOCTYPE html>
<html>
<head>
    <title>Plastic Waste Logger</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ AI Scripts (ADDED) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <span class="navbar-brand">Plastic Recycling System</span>
        <a href="dashboard.html" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            Add Plastic Waste
        </div>

        <div class="card-body">

            <form id="form">

                <!-- ✅ IMAGE UPLOAD (ADDED) -->
                <div class="mb-3">
                    <label>Upload Waste Image</label>
                    <input type="file" id="imageUpload" class="form-control" accept="image/*" required>
                    <img id="preview" width="150" class="mt-2"/>
                    <p id="result" class="mt-2 fw-bold"></p>
                </div>

                <div class="mb-3">
                    <label>Plastic Type</label>
                    <select id="type" class="form-control">
                        <option>PET</option>
                        <option>HDPE</option>
                        <option>LDPE</option>
                        <option>Mixed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Collection Point</label>
                    <input type="text" id="point" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>

                <button class="btn btn-success w-100">Submit</button>
            </form>

        </div>
    </div>

</div>

<!-- ✅ AI SCRIPT (ADDED) -->
<script>
const URL = "YOUR_MODEL_LINK_HERE"; // 🔥 paste your model link

let model;
let isPlasticValid = false;

// Load model
async function loadModel() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
}
loadModel();

// Image upload check
document.getElementById("imageUpload").addEventListener("change", async function(event) {
    const file = event.target.files[0];
    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(file);

    document.getElementById("result").innerText = "Analyzing...";

    img.onload = async () => {
        const prediction = await model.predict(img);

        let best = prediction.reduce((a, b) =>
            a.probability > b.probability ? a : b
        );

        // 🔥 STRICT CHECK
        if (best.className === "Plastic" && best.probability >= 0.85) {
            document.getElementById("result").innerText = "✅ Plastic Confirmed";
            isPlasticValid = true;
        } else {
            document.getElementById("result").innerText = "❌ Not Plastic";
            isPlasticValid = false;
        }
    };
});

// 🔥 BLOCK FORM IF NOT PLASTIC
document.getElementById("form").addEventListener("submit", function(e) {
    if (!isPlasticValid) {
        e.preventDefault();
        alert("❌ Please upload a valid plastic waste image.");
    }
});
</script>

<!-- ORIGINAL SCRIPT (UNCHANGED) -->
<script src="script.js">
    (async () => {
    const res = await fetch('/check-auth');
    const data = await res.json();

    if (!data.loggedIn) {
        window.location = 'login.html';
    }
})();
</script>

</body>
</html>
