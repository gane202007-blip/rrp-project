<!DOCTYPE html>
<html>
<head>
    <title>Plastic Waste Logger</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <span class="navbar-brand">Plastic Recycling System</span>
        <a href="dashboard.html" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            Add Plastic Waste
        </div>

        <div class="card-body">

            <form id="form">

                <div class="mb-3">
                    <label>Plastic Type</label>
                    <select id="type" class="form-control">
                        <option>PET</option>
                        <option>HDPE</option>
                        <option>LDPE</option>
                        <option>Mixed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Collection Point</label>
                    <input type="text" id="point" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>

                <button class="btn btn-success w-100">Submit</button>
            </form>

        </div>
    </div>

</div>

<script src="script.js">
    (async () => {
    const res = await fetch('/check-auth');
    const data = await res.json();

    if (!data.loggedIn) {
        window.location = 'login.html';
    }
})();
</script>
</body>
</html>
